<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0d24">
  <meta name="description" content="ストーリーモードとフリー対戦が遊べるファンタジーチェスRPG">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="チェスクエスト">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>シンプルチェスクエスト</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- タイトル画面 -->
  <main id="title" class="screen title-screen">
    <div class="sky" aria-hidden="true">
      <div class="stars"></div><div class="stars stars2"></div>
      <div class="moon"></div>
      <svg class="tower" viewBox="0 0 100 400" preserveAspectRatio="xMidYMax meet">
        <path d="M50 4 L56 40 H44Z" fill="#0d0b1f"/>
        <path d="M30 400 V78 H24 V54 h8 v9 h8 v-9 h8 v9 h4 v-9 h8 v9 h8 v-9 h8 V78 H70 V400Z" fill="#0d0b1f"/>
        <path d="M30 210 h40 M30 300 h40" stroke="#17143a" stroke-width="2"/>
        <rect class="glow-win" x="45" y="92" width="10" height="18" rx="5" fill="#ff2a4f"/>
        <rect x="38" y="160" width="6" height="11" rx="3" fill="#ffcf6b" opacity=".5"/>
        <rect x="56" y="240" width="6" height="11" rx="3" fill="#ffcf6b" opacity=".4"/>
        <rect x="40" y="330" width="6" height="11" rx="3" fill="#ffcf6b" opacity=".35"/>
      </svg>
      <svg class="land" viewBox="0 0 400 100" preserveAspectRatio="none">
        <path d="M0 50 L40 25 L80 40 L130 10 L170 35 L210 22 L260 42 L300 12 L350 34 L400 18 V100 H0Z" fill="#1a1838"/>
        <path d="M0 75 Q100 58 200 72 T400 68 V100 H0Z" fill="#0b0a18"/>
      </svg>
    </div>

    <div class="title-inner">
      <div id="titleLogo" class="logo-block">
        <div class="emblem" aria-hidden="true">&#9822;&#xFE0E;</div>
        <h1 class="logo-text"><span class="logo-small">シンプルチェス</span><span class="logo-big">クエスト</span></h1>
        <div class="logo-sub">〜 影の塔と黒の帝王 〜</div>
      </div>

      <nav class="rpg-window title-menu" aria-label="タイトルメニュー">
        <button type="button" id="continueBtn" class="rpg-item" hidden>
          <span class="rpg-label">つづきから<small id="continueSub"></small></span>
        </button>
        <button type="button" id="storyBtn" class="rpg-item">
          <span class="rpg-label">ストーリーモード<small id="storyBannerSub"></small></span>
          <span id="storyBannerAv" class="rpg-av"></span>
        </button>
        <button type="button" id="freeBtn" class="rpg-item">
          <span class="rpg-label">フリー対戦<small>CPU対戦・2人対戦</small></span>
        </button>
        <button type="button" id="settingsBtn" class="rpg-item">
          <span class="rpg-label">せってい<small>効果音・BGM・振動</small></span>
        </button>
      </nav>
      <p id="installHint" class="hint title-hint" hidden></p>
    </div>
  </main>

  <!-- フリー対戦メニュー -->
  <main id="menu" class="screen" hidden>
    <header class="topbar">
      <button type="button" id="menuBackBtn" class="back-btn" aria-label="タイトルにもどる"><span class="back-arrow" aria-hidden="true">&#9664;&#xFE0E;</span>もどる</button>
      <h1 class="title">フリー対戦</h1>
    </header>
    <div class="menu-wrap">
    <div class="menu-card">

      <section>
        <h2>モード</h2>
        <div class="seg" data-name="mode" role="radiogroup">
          <button type="button" data-value="cpu">CPUと対戦</button>
          <button type="button" data-value="pvp">2人で対戦</button>
        </div>
      </section>

      <div id="cpuOptions">
        <section>
          <h2>CPUの強さ</h2>
          <div class="seg" data-name="level" role="radiogroup">
            <button type="button" data-value="1">やさしい</button>
            <button type="button" data-value="2">ふつう</button>
            <button type="button" data-value="3">つよい</button>
          </div>
        </section>
        <section>
          <h2>あなたの色</h2>
          <div class="seg" data-name="color" role="radiogroup">
            <button type="button" data-value="w">白（先手）</button>
            <button type="button" data-value="b">黒（後手）</button>
            <button type="button" data-value="r">ランダム</button>
          </div>
        </section>
      </div>

      <button type="button" id="startBtn" class="btn primary">対局開始</button>
      <button type="button" id="resumeBtn" class="btn" hidden>前回の続きから</button>
    </div>
    </div>
  </main>

  <!-- せってい -->
  <div id="settingsModal" class="modal" hidden>
    <div class="modal-card rpg-window settings-card">
      <header class="settings-head">
        <button type="button" id="settingsBack" class="back-btn" aria-label="タイトルにもどる"><span class="back-arrow" aria-hidden="true">&#9664;&#xFE0E;</span>もどる</button>
        <h3>せってい</h3>
      </header>
      <section>
        <h2>効果音</h2>
        <div class="seg" data-name="sound" role="radiogroup">
          <button type="button" data-value="on">オン</button>
          <button type="button" data-value="off">オフ</button>
        </div>
      </section>
      <section>
        <h2>BGM</h2>
        <div class="seg" data-name="bgm" role="radiogroup">
          <button type="button" data-value="on">オン</button>
          <button type="button" data-value="off">オフ</button>
        </div>
      </section>
      <section id="hapticSection">
        <h2>振動</h2>
        <div class="seg" data-name="haptic" role="radiogroup">
          <button type="button" data-value="on">オン</button>
          <button type="button" data-value="off">オフ</button>
        </div>
      </section>
    </div>
  </div>

  <!-- ストーリー: ステージ選択 -->
  <main id="story" class="screen" hidden>
    <header class="topbar">
      <button type="button" id="storyBackBtn" class="back-btn" aria-label="タイトルにもどる"><span class="back-arrow" aria-hidden="true">&#9664;&#xFE0E;</span>もどる</button>
      <h1 class="title">ストーリー「影の塔」</h1>
      <span id="debugBadge" class="debug-badge" hidden>DEBUG</span>
      <div id="storyCount" class="story-count"></div>
    </header>
    <div id="storyList" class="story-list"></div>
    <div class="story-extra">
      <button type="button" id="prologueBtn" class="btn small">プロローグを見る</button>
      <button type="button" id="endingBtn" class="btn small" hidden>エンディングを見る</button>
      <button type="button" id="resetStoryBtn" class="btn small" hidden>進行をリセット</button>
    </div>
  </main>

  <!-- 対局画面 -->
  <main id="game" class="screen" hidden>
    <header class="topbar">
      <button type="button" id="menuBtn" class="back-btn" aria-label="もどる"><span class="back-arrow" aria-hidden="true">&#9664;&#xFE0E;</span>もどる</button>
      <h1 id="gameTitle" class="title"></h1>
      <button type="button" id="soundBtn" class="icon-btn sound-btn" aria-label="効果音をオフにする">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="mute" d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <div class="layout">
      <div class="board-area">
        <div class="player" id="playerTop">
          <span class="avatar" hidden></span><span class="dot"></span><span class="name"></span>
          <span class="captured"></span><span class="adv"></span>
        </div>
        <div class="board-wrap">
          <div id="board" role="grid" aria-label="チェス盤"></div>
          <div id="bubble" class="bubble" hidden></div>
        </div>
        <div class="player" id="playerBottom">
          <span class="avatar" hidden></span><span class="dot"></span><span class="name"></span>
          <span class="captured"></span><span class="adv"></span>
        </div>
      </div>

      <aside class="side">
        <div id="status" class="status" aria-live="polite"></div>
        <div class="controls">
          <button type="button" id="undoBtn" class="btn">待った</button>
          <button type="button" id="flipBtn" class="btn">盤を反転</button>
          <button type="button" id="newBtn" class="btn">新しい対局</button>
        </div>
        <div id="moveList" class="moves" aria-label="棋譜"></div>
      </aside>
    </div>
  </main>

  <!-- ストーリーの会話シーン -->
  <div id="scene" class="scene" hidden>
    <div id="sceneChapter" class="scene-chapter"></div>
    <button type="button" id="sceneSkip" class="scene-skip">スキップ &#8250;&#8250;</button>
    <div class="scene-stage"><div id="scenePortrait" class="scene-portrait"></div></div>
    <div class="scene-box">
      <div id="sceneName" class="scene-name"></div>
      <p id="sceneText" class="scene-text"></p>
      <span class="scene-next" aria-hidden="true">&#9660;</span>
    </div>
  </div>

  <!-- デバッグ: 各話の確認 -->
  <div id="debugModal" class="modal" hidden>
    <div class="modal-card debug-card">
      <div id="debugAv" class="result-av"></div>
      <h3 id="debugTitle"></h3>
      <dl class="debug-lines">
        <dt>負けたとき</dt><dd id="debugLose"></dd>
        <dt>王手のとき</dt><dd id="debugCheck"></dd>
      </dl>
      <div class="debug-actions">
        <button type="button" class="btn" data-act="intro">開始前の会話</button>
        <button type="button" class="btn" data-act="outro">勝利後の会話</button>
        <button type="button" class="btn" data-act="play">対戦する</button>
        <button type="button" class="btn" data-act="clear">クリア扱いにする</button>
      </div>
      <button type="button" class="btn small" data-act="close">閉じる</button>
    </div>
  </div>

  <!-- 成り駒選択 -->
  <div id="promoModal" class="modal" hidden>
    <div class="modal-card">
      <h3>成る駒を選んでください</h3>
      <div id="promoChoices" class="promo-choices"></div>
      <button type="button" id="promoCancel" class="btn small">キャンセル</button>
    </div>
  </div>

  <!-- 結果表示 -->
  <div id="resultModal" class="modal" hidden>
    <div class="modal-card">
      <div id="resultAv" class="result-av" hidden></div>
      <h3 id="resultTitle"></h3>
      <p id="resultText"></p>
      <div class="modal-actions">
        <button type="button" id="resultClose" class="btn">盤面を見る</button>
        <button type="button" id="resultNew" class="btn primary">もう一局</button>
      </div>
    </div>
  </div>

  <!-- 確認ダイアログ -->
  <div id="confirmModal" class="modal" hidden>
    <div class="modal-card">
      <p id="confirmText"></p>
      <div class="modal-actions">
        <button type="button" id="confirmNo" class="btn">いいえ</button>
        <button type="button" id="confirmYes" class="btn primary">はい</button>
      </div>
    </div>
  </div>

  <!-- 画面切り替えの暗転幕 -->
  <div id="curtain" class="curtain" hidden></div>

  <!-- 新しいバージョンのお知らせ -->
  <div id="updateBar" class="update-bar" role="status" hidden>
    <span>新しいバージョンがあります</span>
    <button type="button" id="updateLater" class="btn small">あとで</button>
    <button type="button" id="updateBtn" class="btn small primary">更新</button>
  </div>

  <script src="chess.js"></script>
  <script src="feedback.js"></script>
  <script src="story.js"></script>
  <script src="app.js"></script>
</body>
</html>
