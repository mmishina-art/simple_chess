<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#4a3a9c"/>
      <stop offset=".55" stop-color="#231a55"/>
      <stop offset="1" stop-color="#0f0d24"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd978" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd978" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a63c9"/>
      <stop offset="1" stop-color="#1b2f74"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c0"/>
      <stop offset=".45" stop-color="#f6cf62"/>
      <stop offset="1" stop-color="#c58a22"/>
    </linearGradient>
  </defs>
  <!-- 背景（全面を塗る。角の丸めは端末側にまかせる） -->
  <rect width="512" height="512" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="78" cy="92" r="3.5" opacity=".9"/><circle cx="430" cy="70" r="4" opacity=".9"/>
    <circle cx="452" cy="300" r="3" opacity=".7"/><circle cx="58" cy="330" r="3" opacity=".7"/>
    <circle cx="120" cy="450" r="2.5" opacity=".6"/><circle cx="395" cy="450" r="3" opacity=".6"/>
    <path d="M410 150l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#ffe9a8"/>
    <path d="M104 190l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#ffe9a8"/>
  </g>
  <circle cx="256" cy="262" r="210" fill="url(#glow)"/>
  <g id="emblem" transform="translate(256 256) scale(1.1) translate(-256 -262)">
  <!-- 紋章の盾 -->
  <path d="M256 92 L392 136 V262 Q392 372 256 432 Q120 372 120 262 V136 Z"
    fill="url(#shield)" stroke="url(#gold)" stroke-width="16" stroke-linejoin="round"/>
  <path d="M256 118 L370 154 V262 Q370 356 256 408 Q142 356 142 262 V154 Z"
    fill="none" stroke="#9fb6ff" stroke-opacity=".35" stroke-width="3"/>
  <!-- 金のナイト（ゲームの駒と同じ形） -->
  <g transform="translate(256 262) scale(6.2) translate(-23 -23)" stroke="#4a2c06" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
    <path fill="url(#gold)" d="M10 40h25v-2.6c0-2.2-1.6-3.6-3.8-3.6H13.8c-2.2 0-3.8 1.4-3.8 3.6z"/>
    <path fill="url(#gold)" d="M13 34c0-6.5 3.6-9.8 7-12.6-3 .2-5.8 1.6-8.2 3.2-1.6 1-3.2.1-2.8-1.6 1.4-5.2 6-10.4 10-12.4l.6-4.4 3.2 3.4c6.8.6 11.2 6.6 11.2 16.2V34z"/>
    <circle cx="19" cy="15" r="1.4" fill="#4a2c06" stroke="none"/>
    <path d="M27 11.5c2.6 2.4 4 6.4 4 11.5" fill="none" stroke-opacity=".7"/>
  </g>
  </g>
</svg>
